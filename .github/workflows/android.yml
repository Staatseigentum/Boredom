name: Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests und APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK bereitstellen
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Spiellogik testen
        run: |
          set -o pipefail
          ./gradlew :core:test --no-daemon --console=plain 2>&1 | tail -n 40

      - name: Debug-APK bauen
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --console=plain 2>&1 | tail -n 40

      - name: Release-APK bauen (unsigniert, prüft R8)
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease --no-daemon --console=plain 2>&1 | tail -n 40

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kollaps-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Testbericht hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test
          if-no-files-found: ignore

  screenshots:
    name: Bildschirme aus der Desktop-Fassung
    runs-on: ubuntu-latest

    # The harness compiles the app's own interface sources against Compose Multiplatform and
    # renders them without a display, so every run leaves behind pictures of the actual screen.
    # That is the only automated look at the interface there is — nothing else in this pipeline
    # ever draws it.
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Bildschirme rendern
        run: |
          set -o pipefail
          ./gradlew --configure-on-demand --no-daemon --console=plain \
            :desktop:run -PmainClass=com.staatseigentum.kollaps.desktop.ScreenshotsKt \
            --args="build/screenshots" 2>&1 | tail -n 40

      - name: Bildschirme hochladen
        uses: actions/upload-artifact@v4
        with:
          name: kollaps-bildschirme
          path: build/screenshots/*.png
          if-no-files-found: error
