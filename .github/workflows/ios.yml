name: iPhone

# Baut die unsignierte IPA. Getrennt vom Release, weil das hier eine eigene Maschine braucht —
# ein iOS-Programm lässt sich nur auf einem Mac zusammenbauen — und weil eine iPhone-Fassung,
# die gerade nicht durchgeht, weder das APK noch die Windows-Fassung aufhalten darf.
#
# Das Release ruft denselben Job über `workflow_call` auf, damit es die Schritte nicht ein
# zweites Mal gibt.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. 4.2.0'
        required: false
        default: '0.0.0'
  workflow_call:
    inputs:
      version:
        required: true
        type: string
  # Auf dem Entwicklungszweig bei jeder Änderung, die die iPhone-Fassung betreffen kann. Der
  # geteilte Bildschirm gehört dazu: er wird hier mitkompiliert, also bricht er hier auch.
  push:
    branches: ['claude/**']
    paths:
      - 'ios/**'
      - 'settings-ios.gradle.kts'
      - 'core/src/main/kotlin/**'
      - 'app/src/main/kotlin/**'
      - '.github/workflows/ios.yml'

# Ein Lauf je Zweig. Kotlin/Native braucht für einen kalten Bau eine gute Stunde, und zwei davon
# gleichzeitig heißt nur, dass beide auf dieselbe Maschine warten.
concurrency:
  group: iphone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    name: Unsignierte IPA
    # Apple-Silicon-Läufer mit Xcode. Der Linker für arm64-iOS und `actool` kommen beide von dort.
    runs-on: macos-14
    # Der Standard wären sechs Stunden. Ein Bau, der so lange braucht, hängt — und hängt dann
    # sechs Stunden lang, statt es zu sagen.
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Der Kotlin/Native-Werkzeugkasten: Übersetzer, LLVM und die Apple-Sysroots, zusammen gut
      # anderthalb Gigabyte. `setup-gradle` kümmert sich um `~/.gradle` und nicht um `~/.konan`,
      # also lud der erste Lauf das jedes Mal neu — was den halben Bau ausmachte.
      #
      # Der Schlüssel hängt an der Kotlin-Version, weil genau die entscheidet, welcher
      # Werkzeugkasten geladen wird; `restore-keys` fängt den Fall ab, dass sie sich ändert und
      # nur ein Teil neu geholt werden muss.
      - name: Kotlin/Native-Werkzeugkasten aus dem Zwischenspeicher
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-

      # Eigene Settings-Datei, siehe deren Kopf: `:ios` wird allein gebaut, weil sonst die
      # JVM- und die Multiplattform-Fassung desselben Kotlin-Plugins über zwei Klassenlader
      # kommen und Kotlin/Natives Werkzeugkasten sich selbst nicht mehr erkennt.
      #
      # `tee` statt `>`: der Bau dauert kalt eine gute Stunde, und ein Log, das erst am Ende
      # erscheint, lässt genau in der Zeit nicht erkennen, ob gerade geladen, übersetzt oder
      # gelinkt wird — oder gar nichts mehr passiert. Die Datei bleibt trotzdem, damit die
      # Fehlerzeilen darunter noch einmal gesammelt herausfallen.
      - name: Programm bauen
        run: |
          set +e
          ./gradlew -c settings-ios.gradle.kts \
            :ios:linkReleaseExecutableIosArm64 \
            --no-daemon --console=plain --info 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            echo "--- Kotlins eigene Fehlerzeilen ---"
            grep -E "^e: |^\* What went wrong|^Caused by|FAILURE:" build.log | head -n 60
          fi
          exit $code

      - name: Bündeln
        run: ios/paket.sh "${{ inputs.version || '0.0.0' }}"

      - name: Nachsehen, was drin ist
        run: |
          unzip -l ios/build/dist/*.ipa
          file ios/build/paket/Payload/Kollaps.app/Kollaps

      - name: IPA weiterreichen
        uses: actions/upload-artifact@v4
        with:
          name: release-ios
          path: ios/build/dist/*.ipa
          if-no-files-found: error
