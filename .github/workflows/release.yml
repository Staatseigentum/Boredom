name: Release

# Tag a commit with v1.1.0 and push the tag — this builds a signed APK, a portable Windows folder
# and, where the runner can, a Windows installer, and publishes them as a GitHub Release. The
# in-app updater on the phone reads exactly that release feed and only ever looks at the APK.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, z. B. v1.1.0'
        required: true

permissions:
  contents: write

jobs:
  # Worked out once and handed to everything below. Two jobs deriving the same string from the
  # same ref is two places for it to disagree, and they run on different operating systems.
  version:
    name: Version bestimmen
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      name: ${{ steps.version.outputs.name }}
    steps:
      - name: Aus Tag oder Eingabe ableiten
        id: version
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            TAG="$REQUESTED_VERSION"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG"

  android:
    name: Signiertes APK
    needs: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Signaturschlüssel prüfen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Kein Signaturschlüssel hinterlegt. Ohne Signatur lässt sich das APK" \
                 "nicht installieren und der Updater kann eine bestehende Installation nicht" \
                 "ersetzen. Lege die Secrets KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS und" \
                 "KEY_PASSWORD an — siehe README, Abschnitt Updates."
            exit 1
          fi

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Android SDK bereitstellen
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Spiellogik testen
        run: |
          set +e
          ./gradlew :core:test --no-daemon --console=plain > build.log 2>&1
          code=$?
          # Kotlin's own error lines first — they are what a failure here almost always is.
          grep -E "^e: |^\\* What went wrong|^Caused by|FAILURE:" build.log | head -n 40
          echo "--- letzte Zeilen ---"
          tail -n 20 build.log
          exit $code

      - name: Schlüssel entpacken
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/kollaps.jks"

      - name: Signiertes APK bauen
        env:
          KOLLAPS_VERSION_NAME: ${{ needs.version.outputs.name }}
          KOLLAPS_KEYSTORE: ${{ runner.temp }}/kollaps.jks
          KOLLAPS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KOLLAPS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KOLLAPS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon --console=plain > build.log 2>&1
          code=$?
          # Kotlin's own error lines first — they are what a failure here almost always is.
          grep -E "^e: |^\\* What went wrong|^Caused by|FAILURE:" build.log | head -n 40
          echo "--- letzte Zeilen ---"
          tail -n 20 build.log
          exit $code

      - name: APK benennen
        id: apk
        run: |
          SOURCE=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$SOURCE" ]; then
            echo "::error::Kein APK gebaut"
            exit 1
          fi
          mkdir -p dist
          TARGET="dist/kollaps-${{ needs.version.outputs.name }}.apk"
          cp "$SOURCE" "$TARGET"
          ls -lh "$TARGET"

      - name: Signatur bestätigen
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -n 1)
          "$APKSIGNER" verify --print-certs dist/*.apk

      - name: Schlüssel wieder entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/kollaps.jks"

      - name: APK weiterreichen
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: dist/*.apk
          if-no-files-found: error

  windows:
    name: Windows-Fassung
    needs: version
    runs-on: windows-latest

    # jpackage only ever builds for the machine it runs on, so a Windows installer needs a
    # Windows runner. It bundles a Java runtime, which is why the result is worth the detour:
    # whoever installs it needs nothing else on their machine.
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      # Only the desktop module and what it depends on. Configuring the Android module here would
      # want an SDK this job has no reason to install.
      #
      # `.\gradlew.bat` rather than `./gradlew`: this runner's shell is PowerShell, and the
      # extensionless name only finds the batch file by way of PATHEXT. Naming the file that is
      # actually meant to run here takes that guess out of the release path.
      #
      # The portable folder is built on its own and first, because it needs nothing but the JDK.
      #
      # The version goes in as an environment variable, not as `-PappVersion=`. The command line
      # was tried and the release died on it: the runner logged `-PappVersion=2.2.0` and Gradle
      # read `2`, somewhere between PowerShell, cmd and the batch wrapper. An environment variable
      # is handed over as one value and never re-parsed.
      - name: Tragbare Fassung bauen
        shell: pwsh
        env:
          KOLLAPS_APP_VERSION: ${{ needs.version.outputs.name }}
        run: |
          Write-Host "Version fuer die Pakete: $env:KOLLAPS_APP_VERSION"
          .\gradlew.bat --configure-on-demand --no-daemon --console=plain :desktop:createDistributable

      # The installer needs the WiX toolset, which is the runner's to provide and not ours. If it
      # is not there, that costs the installer and nothing else: the portable folder is already
      # built, the APK is built in a different job, and the release still goes out. A failure that
      # takes the phone build down with it would be the worse trade by a wide margin.
      - name: Installer bauen
        id: installer
        continue-on-error: true
        shell: pwsh
        env:
          KOLLAPS_APP_VERSION: ${{ needs.version.outputs.name }}
        run: >
          .\gradlew.bat --configure-on-demand --no-daemon --console=plain :desktop:packageMsi

      - name: Zusammenpacken
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $app = Get-ChildItem -Directory desktop/build/compose/binaries/main/app | Select-Object -First 1
          if (-not $app) { Write-Error "Keine tragbare Fassung gebaut"; exit 1 }
          Compress-Archive -Path "$($app.FullName)\*" `
            -DestinationPath "dist/Kollaps-${{ needs.version.outputs.name }}-windows-portabel.zip"

          $msi = Get-ChildItem -Recurse -Filter *.msi desktop/build/compose/binaries | Select-Object -First 1
          if ($msi) {
            Copy-Item $msi.FullName "dist/Kollaps-${{ needs.version.outputs.name }}-setup.msi"
          } else {
            Write-Warning "Kein Installer gebaut — es geht nur die tragbare Fassung mit."
          }

          Get-ChildItem dist | Format-Table Name, Length

      - name: Windows-Dateien weiterreichen
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*
          if-no-files-found: error

  # Dieselben Schritte wie im iPhone-Workflow, nur von hier aus aufgerufen — ein zweites Mal
  # hinschreiben hieße, sie beim nächsten Mal an einer Stelle zu ändern.
  #
  ios:
    name: Unsignierte IPA
    needs: version
    uses: ./.github/workflows/ios.yml
    with:
      version: ${{ needs.version.outputs.name }}

  publish:
    name: Release veröffentlichen
    needs: [version, android, windows, ios]
    # Wartet auf die iPhone-Fassung, hängt aber nicht an ihr. Eine IPA, die gerade nicht
    # durchgeht, darf das Release nicht aufhalten — APK und Windows-Fassung kommen aus eigenen
    # Jobs, und ein Release ohne IPA ist unendlich viel besser als gar keines. Was fehlt, sieht
    # man an den Dateien, die das Release am Ende auflistet.
    #
    # Als Bedingung statt als `continue-on-error` am iOS-Job: Letzteres nimmt GitHub bei einem
    # aufgerufenen Workflow gar nicht erst an — die Datei wird dann ungültig und *gar nichts*
    # läuft mehr, was dieser Kommentar der Nachwelt erspart, noch einmal herauszufinden.
    if: >
      always()
      && needs.android.result == 'success'
      && needs.windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Dateien einsammeln
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Nachsehen, was da ist
        run: ls -lh dist

      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ needs.version.outputs.tag }}" \
            dist/* \
            --title "Kollaps ${{ needs.version.outputs.tag }}" \
            --generate-notes

  # Dieselben Dateien noch einmal, nur nach itch.io.
  #
  # Ein eigener Job und nicht ein Schritt in `publish`: itch.io ist die Zweitverwertung, und ein
  # abgelaufener API-Schlüssel dort darf das GitHub-Release nicht mit sich reißen — der Updater in
  # der App liest das Release-Feed und nichts sonst.
  itch:
    name: itch.io aktualisieren
    needs: [version, android, windows, ios]
    if: >
      always()
      && needs.android.result == 'success'
      && needs.windows.result == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Dateien einsammeln
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Hochladen
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          # Wer die Seite gehört und wie sie heißt, als Repository-Variable: der Name der Seite
          # ist keine Geheimnis, aber er ist auch nichts, was im Workflow festbetoniert gehören
          # würde. Ohne die Variable wird der offensichtliche Name versucht.
          TARGET: ${{ vars.ITCH_TARGET || 'staatseigentum/kollaps' }}
          VERSION: ${{ needs.version.outputs.name }}
        run: |
          set -euo pipefail

          if [ -z "${BUTLER_API_KEY:-}" ]; then
            echo "::notice::Kein BUTLER_API_KEY hinterlegt — itch.io bleibt, wie es ist." \
                 "Schlüssel anlegen unter https://itch.io/user/settings/api-keys und als" \
                 "Repository-Secret BUTLER_API_KEY eintragen."
            exit 0
          fi

          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip
          chmod +x butler
          ./butler -V

          # Ein Kanal je Fassung, und jeder trägt dieselbe Versionsnummer wie das Release.
          # `--if-changed` heißt: was gleich geblieben ist, wird nicht noch einmal als neuer
          # Build gezählt. Die tragbare Fassung geht als .zip hoch — butler packt sie selbst aus,
          # damit die itch-App sie starten kann statt sie nur herunterzuladen.
          #
          # Über ein Muster statt über den ausgeschriebenen Namen: die vier Dateien werden an vier
          # verschiedenen Stellen benannt — zwei davon in einem PowerShell-Schritt und eine in
          # `ios/paket.sh` — und ein Name, der hier ein viertes Mal steht, ist ein Name, der beim
          # nächsten Umbenennen still danebenliegt. Fehlt eine Datei ganz, sagt es das laut.
          push() {
            channel="$1"
            pattern="$2"
            file=$(ls -1 $pattern 2>/dev/null | head -n 1 || true)
            if [ -z "$file" ]; then
              echo "::warning::Nichts für $pattern gefunden — Kanal $channel bleibt, wie er ist."
              return 0
            fi
            echo "$channel <- $file"
            ./butler push "$file" "$TARGET:$channel" --userversion "$VERSION" --if-changed
          }

          push android 'dist/*.apk'
          push windows 'dist/*-windows-portabel.zip'
          push windows-installer 'dist/*-setup.msi'
          push ios 'dist/*.ipa'

          ./butler status "$TARGET"
